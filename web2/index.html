<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>geofield — two-wasm scale bench</title>
    <style>
      body { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 1.5rem; color: #ddd; background: #1a1a1a; }
      h1 { font-size: 1.1rem; } h2 { font-size: 0.95rem; margin-top: 1.5rem; color: #9cf; }

  <body>
    <h1>geofield — two-wasm scale bench</h1>
    <p>Loads the EUPL kernel + BSD engine as two wasm modules, fits the scenario stack

    <script type="module" src="/src/main.ts"></script>

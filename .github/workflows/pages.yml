# Publish the web3 app to GitHub Pages on every pushed tag.
#
# One build of both WebAssembly modules (the EUPL kernel and the BSD engine — still two
# separate artifacts, see web3/public/NOTICE.txt) feeds two JS builds:
#   1. base "/"        → the Playwright functional gate (Constitution I) runs against it;
#   2. base "/<repo>/" → what is deployed (a project site is served from a sub-path).
# A red gate means nothing is deployed.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Pages

on:
  push:
    tags: ["*"]
  workflow_dispatch: # re-deploy by hand (e.g. after enabling Pages)

permissions:
  contents: read

# One deploy at a time; a newer tag waits rather than cancelling a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web3
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web3/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build the kernel and engine wasm
        run: npm run wasm

      # The "Erosion over stack (imported meshes)" template fetches five generated
      # ~13 MB meshes from public/meshes (gitignored; see public/meshes/README.md).
      - name: Generate template meshes
        working-directory: .
        run: cargo test --release -p geofield --test gen_erosion_meshes -- --ignored

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Functional gate (Playwright)
        env:
          CI: "true"
        run: |
          # mesh-path-roundtrip.spec expects its fixture mesh to be served; test-only, so it
          # is removed again before the deploy build.
          cp e2e/fixtures/mesh-span-domain.obj public/meshes/
          npm run build
          npx playwright test
          rm public/meshes/mesh-span-domain.obj

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web3/test-results
          if-no-files-found: ignore

      - name: Build for Pages
        env:
          GEOFIELD_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web3/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

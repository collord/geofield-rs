[workspace]
members = ["crates/geofield-types", "crates/geofield-kernel", "crates/geofield"]
resolver = "2"

# Two crates:
#   geofield-kernel — the gempy-validated universal-cokriging interpolation kernel
#                     (assemble/solve/evaluate/litho), the fitted Model, and field-level
#                     faults. No meshing; WASM-safe.
#   geofield        — meshing (octree dual contouring), multi-series stacking, per-block
#                     fault meshing, the CLI, and WASM bindings. Depends on the kernel.
#
# The validation/ harness drives `geofield-cli` (built from the geofield crate); the
# web harness builds the geofield crate to wasm.

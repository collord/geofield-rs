[package]
name = "geofield"
version = "0.1.0"
edition = "2021"
description = "Geological meshing engine: adaptive octree dual contouring, multi-series stacking, per-block fault meshing, WASM bindings. Queries the cokriging field through the geofield-types ScalarField oracle — across a wasm module boundary in the browser, in-process for native tests/CLI."
# BSD: this crate is independent work. It does NOT embed the EUPL kernel in its wasm
# artifact — the field oracle is reached across a wasm-module boundary (imports), so
# geofield.wasm contains no gempy-derived code. (See the cfg-gated native dep below.)
license = "BSD-3-Clause"

[dependencies]
# Interface-only types shared with the kernel (ScalarField, HalfSpace). Permissive.
geofield-types = { path = "../geofield-types" }
wasm-bindgen = { version = "0.2", optional = true }
# Fixture I/O for the geofield-cli validation binary (feature = "cli").
npyz = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
# Hierarchy UI↔core DTOs (feature 001 / contract D5). serde for (de)serialization across
# the wasm boundary; derive only. Used by both the `wasm` ABI layer and native DTO tests,
# so it is a normal (non-optional) dep — it is tiny and pulls no platform-specific code.
serde = { version = "1", features = ["derive"] }
# Mesh–mesh seam corefinement (`src/mesh_clip.rs`): per-cut-face constrained Delaunay
# re-triangulation. We use `spade` (not `cdt`): a corefinement seam vertex routinely lands
# EXACTLY on a cut face's boundary edge (the seam enters/exits every face through an edge), and
# `cdt` 0.1 silently drops whole sub-regions on that case, leaving holes. `spade`'s
# `add_constraint_and_split` handles a constraint endpoint on an existing vertex/edge and tiles
# the face completely. Its predicates come from the `robust` crate (adaptive-exact, pure-Rust,
# wasm-clean) so the triangulation's sign decisions are stable native vs wasm.
spade = "2"

# Exact-arithmetic corefiner — Stage 0 de-risk spike (docs/12). OPTIONAL + default-off: pulled in
# only by `feature = "exact_arr"`, so the default `geofield.wasm` artifact does not grow until the
# path is real. `dashu` is pure-Rust big rational/bigint (MIT/Apache, zero FFI, builds clean for
# wasm32 — verified), the EXACT leg of the eventual lazy kernel. `geometry-predicates` (the
# expansion/interval fast leg) is added with the lazy filter in a later increment; increment 1 is
# the all-exact-rational determinism kill-test and needs only `dashu`.
dashu = { version = "0.4", optional = true }

# NATIVE ONLY. The kernel is linked in-process for native tests + the CLI so they can
# build a real Model and mesh it. This dependency is `cfg(not(wasm32))`, so it is NOT
# part of the wasm32 build graph — `geofield.wasm` never links the EUPL kernel; the
# browser reaches the field oracle through wasm IMPORTS instead (see src/remote.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
geofield-kernel = { path = "../geofield-kernel" }

[features]
default = []
# Native parallel BLAS (via the kernel, native only).
native-parallel = []
wasm = ["dep:wasm-bindgen", "dep:serde_json"]
# Exact-arithmetic corefiner spike (docs/12). Default-off; gates the `exact_arr` module and its
# exact-rational deps. NEVER replaces `mesh_clip::clip` — it is an additive, parallel path.
exact_arr = ["dep:dashu"]
# The validation CLI (geofield-cli) reads/writes .npy + .json fixtures (native).
cli = ["dep:npyz", "dep:serde_json"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "geofield-cli"
path = "src/bin/geofield_cli.rs"
required-features = ["cli"]

[dev-dependencies]
npyz = "0.8"
serde_json = "1"
